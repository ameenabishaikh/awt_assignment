<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="dist/app.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Product Inventory Manager</h1>
        <p>Manage your products easily.</p>

        <h2>Add New Product</h2>

        <form id="productForm">
            <label for="productName">Product Name:</label>
            <input type="text" id="productName" required>

            <label for="productPrice">Price (₹):</label>
            <input type="number" id="productPrice" min="0.01" step="0.01" required>

            <label for="productQuantity">Quantity:</label>
            <input type="number" id="productQuantity" min="0" step="1" required>

            <button type="submit">Add Product</button>
        </form>

        <p id="message"></p>

        <h2>Product List</h2>

        <label for="searchInput">Search Products:</label>
        <input type="text" id="searchInput" placeholder="Enter product name">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="productTableBody"></tbody>
        </table>
    </div>

</body>
</html>
